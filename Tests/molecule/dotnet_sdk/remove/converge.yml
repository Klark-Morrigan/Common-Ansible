---
# Converge - desire the empty set where prepare installed 10.0.100. With no
# entries the resolve loop is empty (no feed query), so the pattern receives
# an empty desired set, finds 10.0.100 installed and stale, and removes it
# entirely. host_file_server_base_url is unused here (nothing to install)
# but set for contract clarity.

- name: Converge - remove all .NET SDKs (empty desired set)
  hosts: all
  gather_facts: false
  vars:
    host_file_server_base_url: http://127.0.0.1:18833
    dotnet_sdk_versions: []
  tasks:
    - name: Include the role under test
      ansible.builtin.include_role:
        name: dotnet_sdk
