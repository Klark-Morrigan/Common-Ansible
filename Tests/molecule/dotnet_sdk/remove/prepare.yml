---
# Prepare the uninstall scenario: bring the fixture up and install .NET SDK
# 10.0.100. Converge then desires the empty set, so the pattern removes it.

- name: Prepare - fixture up, then install .NET SDK 10.0.100
  hosts: all
  gather_facts: false
  vars:
    fixture_port: 18833
    fixture_stage_dir: /var/lib/dotnet-fixture/srv
    fixture_build_dir: /var/lib/dotnet-fixture/build
    fixture_api_prefix: dotnet/release-metadata
    fixture_channel: "10.0"
    fixture_latest_sdk: "10.0.100"
    fixture_sdks:
      - version: "10.0.100"
        archive: dotnet-sdk-10.0.100-linux-x64.tar.gz
    # Play-level so the shared (unprefixed) bridge var is not scoped to the
    # include_role below (ansible-lint's no-role-prefix rule only fires on
    # vars passed under a role task).
    dotnet_sdk_releases_base_url: http://127.0.0.1:18833/dotnet/release-metadata
    host_file_server_base_url: http://127.0.0.1:18833
  tasks:
    - name: Bring the fixture http server up
      ansible.builtin.include_tasks: ../tasks/_fixture-dotnet.yml

    - name: Install .NET SDK 10.0.100 as the baseline to be removed
      ansible.builtin.include_role:
        name: dotnet_sdk
      vars:
        dotnet_sdk_versions:
          - channel: "10.0"
            version: "10.0.100"
