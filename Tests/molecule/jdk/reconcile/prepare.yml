---
# Prepare the version-swap scenario: bring the fixture up serving BOTH
# 21.0.1 and 21.0.2 (DESC), then install 21.0.1 by applying the role.
# Converge then desires 21.0.2, so the pattern swaps.

- name: Prepare - fixture up, then install JDK 21.0.1
  hosts: all
  gather_facts: false
  vars:
    fixture_port: 18822
    fixture_stage_dir: /var/lib/jdk-fixture/srv
    fixture_build_dir: /var/lib/jdk-fixture/build
    fixture_api_prefix: adoptium/v3
    fixture_major: "21"
    fixture_releases:
      - version: "21.0.2+13"
        minor: 0
        security: 2
        build: 13
        archive: OpenJDK21U-jdk_x64_linux_hotspot_21.0.2_13.tar.gz
      - version: "21.0.1+12"
        minor: 0
        security: 1
        build: 12
        archive: OpenJDK21U-jdk_x64_linux_hotspot_21.0.1_12.tar.gz
    # Play-level so the shared (unprefixed) bridge var is not scoped to
    # the include_role below (ansible-lint's no-role-prefix rule only
    # fires on vars passed under a role task).
    jdk_adoptium_api_base_url: http://127.0.0.1:18822/adoptium/v3
    host_file_server_base_url: http://127.0.0.1:18822
  tasks:
    - name: Bring the fixture http server up (serves 21.0.1 and 21.0.2)
      ansible.builtin.include_tasks: ../tasks/_fixture-adoptium.yml

    - name: Install JDK 21.0.1 as the pre-swap baseline
      ansible.builtin.include_role:
        name: jdk
      vars:
        jdk_versions:
          - "21.0.1"
