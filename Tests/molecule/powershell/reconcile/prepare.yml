---
# Prepare the version-swap scenario: bring the fixture up serving BOTH
# 7.5.9 and 7.6.4, then install 7.5.9 by applying the role. Converge then
# desires 7.6.4, so the pattern swaps.

- name: Prepare - fixture up, then install PowerShell 7.5.9
  hosts: all
  gather_facts: false
  vars:
    fixture_port: 18852
    fixture_stage_dir: /var/lib/powershell-fixture/srv
    fixture_build_dir: /var/lib/powershell-fixture/build
    fixture_versions:
      - "7.5.9"
      - "7.6.4"
    # Play-level so the shared (unprefixed) bridge var is not scoped to the
    # include_role below (ansible-lint's no-role-prefix rule only fires on
    # vars passed under a role task).
    host_file_server_base_url: http://127.0.0.1:18852
  tasks:
    - name: Bring the fixture http server up (serves 7.5.9 and 7.6.4)
      ansible.builtin.include_tasks: ../tasks/_fixture-powershell.yml

    - name: Install PowerShell 7.5.9 as the pre-swap baseline
      ansible.builtin.include_role:
        name: powershell
      vars:
        powershell_versions:
          - "7.5.9"
