---
# Converge - desire 7.6.4 where prepare installed 7.5.9. The pattern
# uninstalls the stale 7.5.9 (dir, symlink, profile, manifest) BEFORE
# installing 7.6.4, so the shared /usr/local/bin/pwsh symlink is freed then
# repointed at 7.6.4.

- name: Converge - swap PowerShell 7.5.9 -> 7.6.4
  hosts: all
  gather_facts: false
  vars:
    host_file_server_base_url: http://127.0.0.1:18852
    powershell_versions:
      - "7.6.4"
  tasks:
    - name: Include the role under test
      ansible.builtin.include_role:
        name: powershell
