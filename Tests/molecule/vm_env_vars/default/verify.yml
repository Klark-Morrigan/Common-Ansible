---
# Verify - what the converge left behind, then the two mutating cases.
#
# Idempotence (a re-run reporting changed=0) is proven separately by the
# default sequence's `idempotence` phase, which runs before this play.
# That ordering is what lets this play mutate: replacing a block and then
# removing it are both writes, and neither can live in a converge whose
# change count is being measured.
#
# The marker spelling is written out here rather than read from the role's
# own vars. It is the entire compatibility contract with the PowerShell
# engine that maintains the same block, so a test that derived it would
# agree with the role however the role spelled it.

- name: Verify - managed block post-conditions
  hosts: all
  gather_facts: false
  vars:
    block_begin: "# BEGIN {{ block_name }}"
    block_end: "# END {{ block_name }}"
  tasks:
    # One assertion for the whole file, rather than one per property. The
    # block's content, its markers, its position and the untouched
    # surroundings are not separable claims: they are the file, and
    # comparing the file line for line is the only check that also fails
    # when the role writes something nobody asked for.
    - name: Read the environment file after the converge
      ansible.builtin.slurp:
        src: "{{ target_file }}"
      become: true
      register: converged_file

    - name: Assert the block landed intact below the untouched lines
      ansible.builtin.assert:
        that:
          - >-
            (converged_file.content | b64decode).splitlines()
            == surrounding_text.splitlines() + [block_begin]
               + fixture_block_lines + [block_end]
        fail_msg: >-
          {{ target_file }} does not hold the seeded lines followed by the
          declared block:
          {{ (converged_file.content | b64decode).splitlines() }}

    # The write states root:root 0644 rather than inheriting it, and the
    # seed was planted nobody:nogroup 0600 - so this is the assertion that
    # tells an applied policy from an inherited one.
    - name: Stat the environment file
      ansible.builtin.stat:
        path: "{{ target_file }}"
      become: true
      register: converged_stat

    - name: Assert the environment file is root root at 0644
      ansible.builtin.assert:
        that:
          - converged_stat.stat.isreg
          - converged_stat.stat.pw_name == 'root'
          - converged_stat.stat.gr_name == 'root'
          - converged_stat.stat.mode == '0644'
        fail_msg: >-
          {{ target_file }} is not a root:root 0644 regular file;
          stat: {{ converged_stat.stat }}

    # Replacement, under the SAME block name: one variable's value
    # changes, one is dropped, one is added. The drop is the case that
    # matters - a reconcile that only ever added would satisfy every
    # assertion above while leaving a retracted variable on the host for
    # good.
    - name: Reconcile the same block with a different entry set
      ansible.builtin.include_role:
        name: vm_env_vars
      vars:
        vm_env_vars_block_name: "{{ block_name }}"
        vm_env_vars_entries: "{{ replacement_entries }}"

    - name: Read the environment file after the replacement
      ansible.builtin.slurp:
        src: "{{ target_file }}"
      become: true
      register: replaced_file

    - name: Assert the block was replaced and the surroundings kept
      ansible.builtin.assert:
        that:
          - >-
            (replaced_file.content | b64decode).splitlines()
            == surrounding_text.splitlines() + [block_begin]
               + replacement_block_lines + [block_end]
        fail_msg: >-
          {{ target_file }} was not reconciled to the replacement block:
          {{ (replaced_file.content | b64decode).splitlines() }}

    # Removal - an empty entry list against a declared block name, which
    # is how an operator retracts the whole block.
    - name: Reconcile the same block with no entries at all
      ansible.builtin.include_role:
        name: vm_env_vars
      vars:
        vm_env_vars_block_name: "{{ block_name }}"
        vm_env_vars_entries: []

    - name: Read the environment file after the removal
      ansible.builtin.slurp:
        src: "{{ target_file }}"
      become: true
      register: removed_file

    # Compared as bytes, not as lines. This is the strongest claim the
    # scenario can make and the reason the seed exists: after a block is
    # written, replaced and removed, the file has to be exactly what it
    # was before the role ever ran - no orphaned markers, no blank line
    # left where the block was, no rival consumer's block disturbed.
    - name: Assert the file is byte identical to the seeded content
      ansible.builtin.assert:
        that:
          - (removed_file.content | b64decode) == surrounding_text
        fail_msg: >-
          {{ target_file }} did not return to its seeded content after the
          block was removed:
          {{ (removed_file.content | b64decode) | to_json }}
