---
# Converge - write the declared block into the seeded environment file.
#
# Also what `molecule idempotence` re-runs, so it is this play that has to
# report changed=0 against a host whose block is already correct.
#
# include_role (not import_role) defers resolution to runtime so the
# molecule.yml ANSIBLE_ROLES_PATH override is honoured.

- name: Converge - reconcile the declared environment block
  hosts: all
  gather_facts: false
  tasks:
    - name: Include the role under test
      ansible.builtin.include_role:
        name: vm_env_vars
      vars:
        vm_env_vars_block_name: "{{ block_name }}"
        vm_env_vars_entries: "{{ fixture_entries }}"

    # The role's standing promise is that a play can include it
    # unconditionally and let config decide whether this host declares
    # anything. That is a claim about BOTH fields being unset - the
    # empty entry list on its own means "remove the block", which is a
    # write - so it is exercised here rather than left to the first
    # consumer to discover.
    - name: Include the role under test with nothing declared
      ansible.builtin.include_role:
        name: vm_env_vars

    # The retraction path, against a block name this scenario never
    # writes. It is here for what it must NOT add to the report: a
    # removal leaves the host carrying no variable from that block, so
    # there is nothing for the report to list, and an accumulator that
    # gained a row would be describing a variable that is not there.
    #
    # Idempotent, and not by luck - removing a block that was never
    # written is a no-op, which is what lets this sit in the converge
    # where the accumulator is visible at all.
    - name: Include the role under test retracting a block it never wrote
      ansible.builtin.include_role:
        name: vm_env_vars
      vars:
        vm_env_vars_block_name: "{{ retracted_block_name }}"
        vm_env_vars_entries: []

    # The report accumulator is asserted HERE rather than in verify.yml
    # because it is a fact, and molecule's verifier is a separate
    # ansible-playbook run that cannot see one.
    #
    # Status is asserted as a DOMAIN rather than as a value: `molecule
    # idempotence` re-runs this converge against a host whose block is
    # already correct, where every entry is `unchanged`, so pinning
    # `written` would pass on the first pass and fail on the second.
    - name: Assert the reconcile recorded every declared variable
      ansible.builtin.assert:
        that:
          # One entry per declared variable. Neither the no-op include
          # nor the retraction above contributed one: the first is the
          # other half of the promise that an unset role does nothing,
          # the second is the promise that a removed block leaves
          # nothing to report.
          - env_vars_report_entries | length == fixture_entries | length
          - >-
            env_vars_report_entries | map(attribute='name') | list
            == fixture_entries | map(attribute='name') | list
          # The value as DECLARED, not as escaped into the file: what an
          # operator confirms off the report is what a process reads back.
          - >-
            env_vars_report_entries | map(attribute='value') | list
            == fixture_entries | map(attribute='value') | list
          - >-
            env_vars_report_entries | map(attribute='block') | unique | list
            == [block_name]
          - >-
            env_vars_report_entries | map(attribute='target') | unique | list
            == [target_file]
          - >-
            env_vars_report_entries
            | rejectattr('status', 'in', ['written', 'unchanged'])
            | list | length == 0
        fail_msg: >-
          the environment variables report accumulator does not describe
          the reconcile:
          {{ env_vars_report_entries | default('<unset>') }}

    # Render what the reconcile just accumulated, which is the one place
    # producer and template meet on real data: Tests/molecule/env_vars_report
    # seeds its entries by hand, so a field vm_env_vars stopped emitting
    # would pass there and surface only in front of an operator. The
    # rendering itself is asserted in that scenario - failing HERE means
    # the two halves of the contract no longer fit together.
    - name: Render the report from the accumulator the reconcile produced
      ansible.builtin.include_role:
        name: env_vars_report

    # One claim about the rendering, made here because this is the only
    # fixture that can make it: these values went through the escaping
    # renderer on their way into the file, and the report has to show what
    # was DECLARED - a row carrying \" or \\ would be describing the file
    # rather than the value a process reads back.
    #
    # The status column is read off the accumulator rather than pinned,
    # for the reason the assertions above give: `molecule idempotence`
    # re-runs this converge against a host whose block is already correct.
    - name: Assert every declared variable renders with its declared value
      vars:
        expected_row: >-
          {{ '    ' ~ ('%-9s' | format(env_vars_report_entries[0].status))
             ~ ' ' ~ item.name ~ "='" ~ item.value ~ "'" }}
      ansible.builtin.assert:
        that:
          - expected_row in env_vars_report_lines
        fail_msg: >-
          '{{ item.name }}' did not render as declared:
          {{ env_vars_report_lines }}
      loop: "{{ fixture_entries }}"
      loop_control:
        label: "{{ item.name }}"
