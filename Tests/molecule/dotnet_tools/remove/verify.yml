---
# Verify the post-remove state: the tool AND the SDK are both fully gone.
# The converge removed the SDK FIRST (driver gone), then the tools - the
# order that used to leak. That the tool's .store slot (both the id-level dir
# and the version dir under it), its tool-path shim binary, its /usr/local/bin
# shim symlink, and its manifest are ALL removed proves the manifest-driven
# uninstall freed the store WITHOUT the driver. The id-level .store/<id> check
# is the exact leak the E2E caught before the fix.

- name: Verify - teardown-order removal post-conditions
  hosts: all
  gather_facts: false
  vars:
    tool_id: dotnet-reportgenerator-globaltool
    tool_version: "5.4.4"
    command_name: reportgenerator
    tools_root: /usr/local/share/dotnet/tools
    tool_manifest: >-
      /var/lib/common-ansible/toolchains/manifests/dotnettool-dotnet-reportgenerator-globaltool-5.4.4.json
    sdk_manifest: /var/lib/common-ansible/toolchains/manifests/dotnet-10.0.100.json
  tasks:
    - name: Stat every tool artifact the install owned
      ansible.builtin.stat:
        path: "{{ item }}"
      register: tool_artifacts
      loop:
        - "{{ tools_root }}/.store/{{ tool_id }}"
        - "{{ tools_root }}/.store/{{ tool_id }}/{{ tool_version }}"
        - "{{ tools_root }}/{{ command_name }}"
        - "/usr/local/bin/{{ command_name }}"
        - "{{ tool_manifest }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert every tool artifact was removed (driver-independent uninstall)
      ansible.builtin.assert:
        that:
          - >-
            (tool_artifacts.results | map(attribute='stat.exists') | list)
            == [false, false, false, false, false]
        fail_msg: >-
          One or more tool artifacts survived removal (the manifest-driven
          uninstall must free the .store slot even with the driver gone):
          {{
            dict(
              tool_artifacts.results | map(attribute='item')
              | zip(tool_artifacts.results | map(attribute='stat.exists'))
            )
          }}

    - name: Stat every SDK artifact the install owned
      ansible.builtin.stat:
        path: "{{ item }}"
      register: sdk_artifacts
      loop:
        - /opt/dotnet-10.0.100
        - /usr/local/bin/dotnet
        - /etc/profile.d/dotnet.sh
        - /etc/dotnet/install_location
        - "{{ sdk_manifest }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert every SDK artifact was removed
      ansible.builtin.assert:
        that:
          - >-
            (sdk_artifacts.results | map(attribute='stat.exists') | list)
            == [false, false, false, false, false]
        fail_msg: >-
          One or more .NET SDK artifacts survived removal:
          {{
            dict(
              sdk_artifacts.results | map(attribute='item')
              | zip(sdk_artifacts.results | map(attribute='stat.exists'))
            )
          }}
