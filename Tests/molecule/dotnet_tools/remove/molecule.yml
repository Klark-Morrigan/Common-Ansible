---
# Molecule scenario for the dotnet_tools role - the parent/child teardown
# ordering test. prepare installs the SDK and a global tool; converge desires
# the empty set for BOTH, running dotnet_tools (tool removal) BEFORE
# dotnet_sdk (SDK removal) so the driver is still present when the tool
# uninstalls. verify asserts both are gone - a reversed order would leave the
# tool's .store slot behind (the driver would be gone), which verify catches.
#
# Same container/driver/verifier shape as the default scenario; see that
# scenario's molecule.yml for the per-setting rationale.

dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: instance
    image: common-ansible/toolchain-host-push-base:24.04
    pre_build_image: true
    command: /bin/sleep infinity
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../../roles"
  config_options:
    defaults:
      stdout_callback: yaml
      callbacks_enabled: profile_tasks
  inventory:
    host_vars:
      instance:
        ansible_user: root

verifier:
  name: ansible
