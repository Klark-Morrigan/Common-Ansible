---
# Prepare - stage what the converge copies FROM, and one directory it
# copies INTO.
#
# The controller-side fixtures are written 0600 and owned by whoever runs
# molecule. That is the point: the converge has to land them root:root
# 0644 regardless, so a fixture that already matched the policy would
# prove nothing about whether the policy is applied or merely inherited.
#
# Each fixture's content is derived from its target path so that the
# verifier can name the exact bytes it expects at each destination, which
# also catches two entries landing the same file.

- name: Prepare - stage the transport fixtures
  hosts: all
  gather_facts: false
  tasks:
    - name: Create the controller side fixture directory
      ansible.builtin.file:
        path: "{{ fixture_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Write the controller side fixture files
      ansible.builtin.copy:
        dest: "{{ item.source }}"
        content: "vm_files fixture for {{ item.target }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      loop: "{{ fixture_entries }}"
      loop_control:
        label: "{{ item.source }}"

    - name: Create the pre-existing target directory on the VM
      ansible.builtin.file:
        path: "{{ preexisting_dir.path }}"
        state: directory
        owner: "{{ preexisting_dir.owner }}"
        group: "{{ preexisting_dir.group }}"
        mode: "{{ preexisting_dir.mode }}"
      become: true

    # Drift, planted deliberately: wrong content, wrong owner, wrong mode.
    # A run that only wrote files that were absent would satisfy every
    # other case in this scenario, so something has to prove the transport
    # RECONCILES a target rather than merely creating one - which is what
    # an operator re-running provisioning after a hand-edit depends on.
    - name: Plant a drifted copy of one target on the VM
      ansible.builtin.copy:
        dest: "{{ drifted_target }}"
        content: "stale bytes the run has to replace"
        owner: nobody
        group: nogroup
        mode: "0600"
      become: true
