---
# Molecule scenario for the vm_files role - single form transport.
#
# One of three: `schema` asserts what the role refuses, `bulk` asserts
# which files a pattern names, and this one asserts what the transport
# does with an entry that already names one file. The default sequence's
# `idempotence` phase is the point of running the transport here rather
# than folding it into the schema converge - a copy that re-reports
# `changed` on an already-converged VM is the failure this scenario exists
# to catch.
#
# Single Ubuntu 24.04 container, Docker driver, ansible verifier. The role
# only writes files, so a non-systemd sleep-infinity container suffices.
#
# Image: reuses the toolchain_host_push base (python3 + sudo on
# ubuntu:24.04). No custom Dockerfile - build it via the command in
# Tests/molecule/toolchain_host_push/Dockerfile.

dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: instance
    image: common-ansible/toolchain-host-push-base:24.04
    pre_build_image: true
    command: /bin/sleep infinity
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  env:
    # ANSIBLE_ROLES_PATH (env) wins over ansible.cfg's roles_path and
    # propagates across every molecule phase. MOLECULE_PROJECT_DIRECTORY
    # is the scenario dir; three levels up is the repo root, then roles/.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../../roles"
  config_options:
    defaults:
      stdout_callback: yaml
      callbacks_enabled: profile_tasks
  inventory:
    host_vars:
      instance:
        ansible_user: root

        # The fixture contract, stated once here because all three phases
        # need it: prepare stages it, converge declares it, verify
        # asserts against it. Ansible resolves these lazily at task time,
        # so the lookup below runs on the controller when it is first
        # used rather than when molecule writes the inventory.
        #
        # Staging into molecule's per-scenario ephemeral directory keeps
        # the fixtures out of the repo working tree and lets `molecule
        # destroy` take them with it.
        fixture_dir: >-
          {{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/vm-files-fixture

        # A directory that already exists on the VM before the role runs,
        # owned by neither root nor 0755 so that "the role left it alone"
        # is an observable claim rather than a coincidence. One mapping
        # rather than four flat vars: it describes a single object, and
        # prepare and verify want all of it or none of it.
        preexisting_dir:
          path: /srv/vm-files-existing
          owner: nobody
          group: nogroup
          mode: "0711"

        # A target that already exists and is wrong in every dimension the
        # role enforces - content, owner and mode. Prepare plants it; no
        # var records its wrong state, because the assertions verify makes
        # about it are the same ones it makes about every other target.
        drifted_target: /srv/vm-files-drifted.conf

        # Already in the role's entry shape, so converge passes it
        # straight through with no projection - the scenario declares
        # exactly what an operator's config would.
        #
        # One entry per case: a parent that must be created (two levels of
        # it), a parent that already exists, and a target that already
        # exists.
        fixture_entries:
          - source: "{{ fixture_dir }}/app.conf"
            target: /etc/vm-files/deep/app.conf
          - source: "{{ fixture_dir }}/lib.json"
            target: "{{ preexisting_dir.path }}/lib.json"
          - source: "{{ fixture_dir }}/drifted.conf"
            target: "{{ drifted_target }}"

verifier:
  name: ansible
