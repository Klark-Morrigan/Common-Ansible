---
# Applies the vm_files role to ONE entry set the role has to refuse, and
# asserts it does, exercising the real role rather than a copy of its
# rules.
#
# Shared by the schema and bulk scenarios, because the two kinds of
# refusal deserve the same treatment: whether an entry is rejected by a
# shape rule or by a pattern that resolves to nothing, the run must fail
# and the failure must name what an operator has to go and fix.
#
# Lives in its own file because `loop` is not a valid attribute on a
# block - the caller loops over an include of this file instead.
#
# Caller contract:
#   vm_files_case.name     what the case is called in failure output.
#   vm_files_case.entries  the value to feed vm_files_entries.
#   vm_files_case.expect   fragments the rejection must contain - the rule
#                          that was violated, and where relevant the
#                          position or pattern of the offending entry.

- name: Assert the entry set is rejected
  vars:
    vm_files_entries: "{{ vm_files_case.entries }}"
  block:
    - name: Apply the role with the malformed entry set
      ansible.builtin.include_role:
        name: vm_files

    # Reached only when no assert in the role fired, which is the
    # regression this whole file exists to catch.
    - name: Fail if the role accepted the entry set
      ansible.builtin.fail:
        msg: >-
          vm_files accepted the case
          '{{ vm_files_case.name }}': {{ vm_files_case.entries }}
  rescue:
    # Distinguish "rejected for the right reason" from any other failure -
    # a role that broke for an unrelated reason would otherwise look like
    # a passing test, and so would one whose messages stopped naming the
    # entry an operator has to go and fix.
    #
    # Searched over the whole serialized result rather than .msg: the
    # per-entry rules run under a `loop`, so the top-level msg can be only
    # "One or more items failed" with the real diagnostic in
    # .results[].msg. Matching the JSON covers both shapes.
    - name: Confirm the rejection named the violated rule
      vars:
        vm_files_case_result: "{{ ansible_failed_result | default({}) | to_json }}"
      ansible.builtin.assert:
        that:
          - item in vm_files_case_result
        fail_msg: >-
          Case '{{ vm_files_case.name }}' was rejected, but the failure
          does not mention '{{ item }}': {{ vm_files_case_result }}
      loop: "{{ vm_files_case.expect }}"
