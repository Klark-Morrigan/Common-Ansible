---
# Molecule scenario for the vm_files role - the entry schema contract.
#
# Split from the transport scenarios on purpose: this one asserts what the
# role REFUSES, which is a different kind of test. Every case applies the
# real role to one malformed entry set and asserts it fails naming the
# violated rule and the offending entry's position - the role's own
# messages, not a copy of them.
#
# converge.yml is the positive control (a well-formed entry set, both
# forms, is accepted) and so is also what `molecule idempotence` re-runs.
# The rejection matrix lives in verify.yml, keeping deliberate failures
# out of the run whose changed-count is being measured.
#
# Single Ubuntu 24.04 container, Docker driver, ansible verifier. What
# the accepted entries then transport is not this scenario's subject -
# Tests/molecule/vm_files/default owns that - but they are real, copyable
# files precisely so acceptance here means an entry that would genuinely
# survive a run rather than one that merely parses.
#
# Image: reuses the toolchain_host_push base (python3 + sudo on
# ubuntu:24.04). No custom Dockerfile - build it via the command in
# Tests/molecule/toolchain_host_push/Dockerfile.

dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: instance
    image: common-ansible/toolchain-host-push-base:24.04
    pre_build_image: true
    command: /bin/sleep infinity
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  env:
    # ANSIBLE_ROLES_PATH (env) wins over ansible.cfg's roles_path and
    # propagates across every molecule phase. MOLECULE_PROJECT_DIRECTORY
    # is the scenario dir; three levels up is the repo root, then roles/.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../../roles"
  config_options:
    defaults:
      stdout_callback: yaml
      callbacks_enabled: profile_tasks
  inventory:
    host_vars:
      instance:
        ansible_user: root

verifier:
  name: ansible
