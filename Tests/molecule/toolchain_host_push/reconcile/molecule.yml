---
# Molecule scenario for the toolchain_host_push role - version swap.
# prepare installs faketool 1.0.0; converge desires 2.0.0, so the role
# uninstalls 1.0.0 and installs 2.0.0. molecule idempotence then re-runs
# converge (2.0.0 already installed, 1.0.0 already gone -> no change).
#
# Same container/driver/verifier shape as the default scenario; see that
# scenario's molecule.yml for the per-setting rationale.

dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: instance
    image: common-ansible/toolchain-host-push-base:24.04
    pre_build_image: true
    command: /bin/sleep infinity
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../../roles"
  config_options:
    defaults:
      stdout_callback: yaml
      callbacks_enabled: profile_tasks
  inventory:
    host_vars:
      instance:
        ansible_user: root

verifier:
  name: ansible
