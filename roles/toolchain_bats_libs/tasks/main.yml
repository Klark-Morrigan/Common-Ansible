---
# Install the desired section-2 bats helper libraries
# (toolchain_bats_libs_packages) at their pinned tags on the target VM,
# idempotently. Each library becomes <base>/<name>/ holding load.bash and
# src/ - the layout `bats_load_library <name>` resolves against
# BATS_LIB_PATH.
#
# The reconciliation is marker-driven. Every install writes a
# .installed-v<version> file into the library directory; a matching marker
# means "installed and current" (skip), a missing one means "absent or
# version-bumped" (reinstall). That is what makes a re-run a genuine no-op
# (changed: 0) while still converging on a pin change - the section-2
# counterpart to toolchain_apt leaning on apt's own installed-state.
#
# An empty toolchain_bats_libs_packages skips every task below (each loops
# an empty list), so a play can always include the role and let config
# decide the set.

# Fail loudly on a malformed entry before touching the filesystem, so a
# config typo surfaces here naming the offending entry rather than as an
# opaque download error later. Both fields are required: name identifies
# the bats-core repo, version pins the tag (no distro fallback exists).
- name: Assert each library entry names a library and pins a version
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name | length > 0
      - item.version is defined
      - item.version | length > 0
    fail_msg: >-
      toolchain_bats_libs_packages entry must set name and version:
      {{ item }}
  loop: "{{ toolchain_bats_libs_packages }}"
  loop_control:
    label: "{{ item.name | default('<no name>') }}"

# Probe the per-library version marker. The marker file name encodes the
# desired version, so its presence answers "already at this exact pin?"
# without reading any content. Absent -> the library is missing or pinned
# to a different version, and every (re)install task below keys its
# `when` off this same result.
- name: Probe the installed-version marker for each desired library
  ansible.builtin.stat:
    path: >-
      {{ toolchain_bats_libs_base_dir }}/{{ item.name }}/.installed-v{{ item.version }}
  loop: "{{ toolchain_bats_libs_packages }}"
  loop_control:
    label: "{{ item.name }}-{{ item.version }}"
  become: true
  register: toolchain_bats_libs_markers

# Clear any prior tree for a library being (re)installed, so a version
# bump cannot leave a previous version's src/*.bash (or its stale marker)
# behind. Absent on a fresh VM is a no-op; the `when` skips libraries
# already at the desired pin, keeping the whole role idempotent.
- name: Remove the prior tree for libraries being (re)installed
  ansible.builtin.file:
    path: "{{ toolchain_bats_libs_base_dir }}/{{ item.item.name }}"
    state: absent
  loop: "{{ toolchain_bats_libs_markers.results }}"
  loop_control:
    label: "{{ item.item.name }}-{{ item.item.version }}"
  when: not item.stat.exists
  become: true

- name: Create the library directory
  ansible.builtin.file:
    path: "{{ toolchain_bats_libs_base_dir }}/{{ item.item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ toolchain_bats_libs_markers.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists
  become: true

# Download and extract in one step. remote_src pulls the pinned tag
# tarball straight onto the target - section 2: the VM fetches it itself,
# no host staging or file server. strip-components=1 drops the GitHub
# "<owner>-<repo>-<sha>/" top directory so load.bash and src/ land
# directly under the library directory. Guarded by the marker so it runs
# only on a real (re)install, never on an idempotent re-run.
- name: Download and extract each library at its pinned tag
  ansible.builtin.unarchive:
    # Double-quoted with escaped line breaks (backslash-newline folds to
    # nothing, unlike >- which would inject spaces into the URL).
    src: "https://github.com/{{ toolchain_bats_libs_github_owner }}\
      /{{ item.item.name }}/archive/refs/tags/v{{ item.item.version }}.tar.gz"
    dest: "{{ toolchain_bats_libs_base_dir }}/{{ item.item.name }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: root
    group: root
  loop: "{{ toolchain_bats_libs_markers.results }}"
  loop_control:
    label: "{{ item.item.name }}-{{ item.item.version }}"
  when: not item.stat.exists
  become: true

# Stamp the installed version LAST - only after a successful extract - so
# an interrupted install leaves no marker and the next run retries rather
# than skipping a half-populated directory. The marker's presence is what
# the probe above reads to make a subsequent run a no-op.
- name: Write the installed-version marker
  ansible.builtin.copy:
    dest: >-
      {{ toolchain_bats_libs_base_dir }}/{{ item.item.name }}/.installed-v{{ item.item.version }}
    content: "{{ item.item.version }}\n"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ toolchain_bats_libs_markers.results }}"
  loop_control:
    label: "{{ item.item.name }}-{{ item.item.version }}"
  when: not item.stat.exists
  become: true

# Append one entry per library to the play-wide report accumulator the
# toolchain_report role renders per host. The marker probe above is also
# the status source: a marker that already existed means this run left the
# library alone, an absent one means every task above just (re)built it.
# load.bash is named explicitly because it is the file consumers actually
# resolve through BATS_LIB_PATH - the one path worth checking by hand when
# `bats_load_library` fails.
- name: Append the bats libraries to the toolchain report
  ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix]
    toolchain_report_entries: >-
      {{ (toolchain_report_entries | default([])) + [entry] }}
  loop: "{{ toolchain_bats_libs_markers.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}-{{ item.item.version }}"
  vars:
    library_dir: "{{ toolchain_bats_libs_base_dir }}/{{ item.item.name }}"
    entry:
      tool: "{{ item.item.name }}"
      version: "{{ item.item.version }}"
      section: vm-download
      status: "{{ 'present' if item.stat.exists else 'installed' }}"
      install_dir: "{{ library_dir }}"
      symlinks: []
      files:
        - "{{ library_dir }}/load.bash"
        - "{{ library_dir }}/.installed-v{{ item.item.version }}"

# Probe what each library actually resolves through. load.bash - not the
# directory - is what `bats_load_library <name>` sources, so its absence is
# the precise failure an operator is chasing when a suite dies with
# "unable to load". Probed unconditionally: on a converged run every
# install task above is skipped, which is exactly when this is worth
# knowing.
- name: Stat each library's load.bash entry point
  ansible.builtin.stat:
    path: "{{ toolchain_bats_libs_base_dir }}/{{ item.name }}/load.bash"
    get_checksum: false
    get_mime: false
    get_attributes: false
  become: true
  loop: "{{ toolchain_bats_libs_packages }}"
  loop_control:
    label: "{{ item.name }}"
  register: toolchain_bats_libs_load_stat

# Append to the artifact report. Nothing is retained: the role unarchives
# the GitHub tag tarball with remote_src straight into the library
# directory, so the tarball is streamed and never lands as a file on the
# VM. The entry says so rather than reporting an empty path.
- name: Append the bats library artifacts to the artifact report
  ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix]
    artifact_report_entries: >-
      {{ (artifact_report_entries | default([])) + [entry] }}
  loop: "{{ toolchain_bats_libs_packages }}"
  loop_control:
    label: "{{ item.name }}-{{ item.version }}"
    index_var: toolchain_bats_libs_artifact_index
  vars:
    load_stat: >-
      {{ toolchain_bats_libs_load_stat.results[
         toolchain_bats_libs_artifact_index].stat }}
    marker_existed: >-
      {{ toolchain_bats_libs_markers.results[
         toolchain_bats_libs_artifact_index].stat.exists }}
    entry:
      tool: "{{ item.name }}"
      version: "{{ item.version }}"
      section: vm-download
      source: >-
        https://github.com/{{ toolchain_bats_libs_github_owner }}/{{
        item.name }}/archive/refs/tags/v{{ item.version }}.tar.gz
      # The marker probe from the top of this file is the acquisition
      # record: an absent marker is what drove the (re)install, so bytes
      # moved; a present one means every fetch task was skipped.
      transfer: "{{ 'none' if marker_existed else 'downloaded' }}"
      # An empty path is what marks a mechanism that retains nothing; the
      # note is what stops that reading as "lost" instead of "by design".
      artifact:
        path: ""
        present: false
        size: 0
        mtime: 0
        note: >-
          the tag tarball is streamed into the library directory by
          remote_src unarchive, so it never lands as a file; presence
          below is probed via that directory's load.bash
      unpacked:
        dir: "{{ toolchain_bats_libs_base_dir }}/{{ item.name }}"
        # Cast explicitly - the report's counters test truthiness, and the
        # STRING "False" is truthy.
        present: "{{ load_stat.exists | bool }}"
