---
# Uninstall one tool no longer desired (dotnet_tools_stale_entry - a parsed
# manifest dict). Inverted from the install file and driven ENTIRELY by what
# the manifest recorded this tool owns, so it is self-sufficient: it does not
# depend on the dotnet driver, and therefore not on the sibling dotnet_sdk
# role still being present. Steps:
#   1. Remove the recorded /usr/local/bin shim symlinks (exactly the recorded
#      paths - never a glob).
#   2. `dotnet tool uninstall <id> --tool-path <root>` - the driver's own
#      clean removal, run best-effort when the driver is present (a swap, or a
#      teardown that still has the SDK). Non-zero is logged, not fatal: once
#      the SDK has been torn down the driver is gone and this simply no-ops,
#      because step 3 guarantees the removal instead.
#   3. Guaranteed manifest-driven removal of the tool-path artifacts the
#      driver would have removed - the command shim binaries under <root>
#      (recorded `commands`) and the tool's .store slot (.store/<id>). This
#      backstops the driver so a reconcile-to-absent frees the store in ANY
#      role order: the SDK being removed before this role no longer leaks the
#      slot (the failure an install-ordered reconcile playbook otherwise hits,
#      since install needs sdk->tools but teardown needs tools->sdk and one
#      static order cannot satisfy both).
#   4. Remove the manifest LAST - the recovery anchor: until it is gone the
#      next reconcile can replay this teardown, so a crash mid-removal is
#      self-healing.
#
# Why a direct rm of .store is safe here (the install file's caution is about
# the --global manifest store, not this one): at a --tool-path a tool id holds
# exactly ONE version - the driver rejects installing a second version of the
# same id to the same path - so .store/<id> maps 1:1 to this install and
# removing it is precisely what `dotnet tool uninstall` does, not a
# cross-version glob. The id is lower-cased to match NuGet's on-disk store
# normalisation.

- name: Remove the recorded /usr/local/bin shim symlinks
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  become: true
  loop: "{{ dotnet_tools_stale_entry.symlinks | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

# The driver's own clean removal, best-effort. failed_when: false so an
# already-freed slot OR an absent driver (rc non-zero) does not abort the
# reconcile - the guaranteed removal below is the load-bearing cleanup, not
# this. The message text is not reliably discriminable across driver versions,
# so a blanket log-and-continue is the safer posture (as in the PowerShell
# port).
- name: Uninstall the global tool via the dotnet driver
  ansible.builtin.command:
    argv:
      - "{{ dotnet_tools_dotnet_bin }}"
      - tool
      - uninstall
      - "{{ dotnet_tools_stale_entry.id }}"
      - --tool-path
      - "{{ dotnet_tools_root }}"
  become: true
  register: dotnet_tools_uninstall_result
  changed_when: dotnet_tools_uninstall_result.rc == 0
  failed_when: false

- name: Note when the driver uninstall did not run cleanly
  ansible.builtin.debug:
    msg: >-
      'dotnet tool uninstall {{ dotnet_tools_stale_entry.id }}' returned exit
      {{ dotnet_tools_uninstall_result.rc }} (driver absent or slot already
      freed); the guaranteed manifest-driven removal below frees the slot.
      stderr: {{ dotnet_tools_uninstall_result.stderr | default('') }}
  when: dotnet_tools_uninstall_result.rc != 0

# Guaranteed removal of the tool-path artifacts, driven by the manifest so it
# holds even when the driver is gone. First the command shim binaries the
# driver placed directly under <root> (recorded `commands`) ...
- name: Remove the tool-path command shim binaries
  ansible.builtin.file:
    path: "{{ dotnet_tools_root }}/{{ item }}"
    state: absent
  become: true
  loop: "{{ dotnet_tools_stale_entry.commands | default([]) }}"
  loop_control:
    label: "{{ item }}"

# ... then the tool's .store slot. See the file header for why the id-level rm
# is precise (one version per tool-path) and why lower-casing matches disk.
- name: Remove the tool's .store slot
  ansible.builtin.file:
    path: "{{ dotnet_tools_root }}/.store/{{ dotnet_tools_stale_entry.id | lower }}"
    state: absent
  become: true

# Manifest path is deterministic from id + version, so it need not be carried
# on the parsed record separately. Removed LAST (see file header).
- name: Remove the tool manifest
  ansible.builtin.file:
    path: >-
      {{ dotnet_tools_manifest_dir }}/dotnettool-{{
      dotnet_tools_stale_entry.id }}-{{ dotnet_tools_stale_entry.version }}.json
    state: absent
  become: true
