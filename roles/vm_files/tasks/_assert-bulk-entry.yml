---
# Rules for the bulk form - every controller-side file matching a glob,
# copied under one target directory. Ported from Assert-VmFileBulkEntry.
#
# The pattern is not resolved here. A glob is time-varying, so the
# resolution the transport performs is the only one whose answer is still
# true when the files are read; a zero-match surfaces there.
#
# Caller contract (set by _assert-entry.yml):
#   vm_files_entry      the entry under validation, known to be a mapping
#                       carrying 'pattern'.
#   vm_files_entry_ctx  message prefix naming the entry.

- name: Assert the bulk form file entry has no unknown sub-fields
  vars:
    vm_files_unknown_fields: >-
      {{ vm_files_entry.keys() | list
         | difference(vm_files_bulk_allowed_fields) }}
  ansible.builtin.assert:
    that:
      - vm_files_unknown_fields | length == 0
    fail_msg: >-
      {{ vm_files_entry_ctx }} has unknown sub-field(s)
      '{{ vm_files_unknown_fields | join(', ') }}'. Allowed bulk-form
      sub-fields: {{ vm_files_bulk_allowed_fields | join(', ') }}.

- name: Assert the bulk form file entry pattern is a non-empty string
  ansible.builtin.assert:
    that:
      - vm_files_entry.pattern is string
      - vm_files_entry.pattern | trim | length > 0
    fail_msg: >-
      {{ vm_files_entry_ctx }}.pattern must be a non-empty string
      (a controller-side glob).

# Two constraints this engine adds to the ported rules. Both are refusals
# where the alternative would be a SILENT divergence from the PowerShell
# engine that owns the same schema, which is the one thing a parity port
# must not produce - a definition that copies one set of files under one
# engine and a different set under the other.
#
# Absolute: a relative pattern resolves against the controller's working
# directory, which is chosen by whichever bridge launched the play. An
# operator's config cannot mean anything stable by it.
#
# Character class ('[ab].jar'): PowerShell expands it, this engine does
# not. Left alone it would still match SOMETHING here - a file genuinely
# named '[ab].jar' - so it is refused rather than quietly resolved to the
# wrong set of files.
- name: Assert the bulk form file entry pattern is an absolute path
  ansible.builtin.assert:
    that:
      - vm_files_entry.pattern.startswith('/')
    fail_msg: >-
      {{ vm_files_entry_ctx }}.pattern must be an absolute controller-side
      path, starting with '/' (got '{{ vm_files_entry.pattern }}').

- name: Assert the bulk form file entry pattern uses no character class
  ansible.builtin.assert:
    that:
      - vm_files_unsupported_wildcard not in vm_files_entry.pattern
    fail_msg: >-
      {{ vm_files_entry_ctx }}.pattern uses the unsupported wildcard
      '{{ vm_files_unsupported_wildcard }}' (character class), which this
      engine does not expand
      (got '{{ vm_files_entry.pattern }}'). Supported wildcards:
      {{ vm_files_wildcard_chars | list | join(', ') }}.

- name: Assert the bulk form file entry declares a targetDir
  ansible.builtin.assert:
    that:
      - "'targetDir' in vm_files_entry"
    fail_msg: >-
      {{ vm_files_entry_ctx }} is missing required sub-field 'targetDir'.

# The type test comes first because assert stops at the first false
# condition, so `startswith` is only reached on a string.
- name: Assert the bulk form file entry targetDir is an absolute path
  ansible.builtin.assert:
    that:
      - vm_files_entry.targetDir is string
      - vm_files_entry.targetDir | trim | length > 0
      - vm_files_entry.targetDir.startswith('/')
    fail_msg: >-
      {{ vm_files_entry_ctx }}.targetDir must be a non-empty absolute
      directory path on the VM, starting with '/'
      (got '{{ vm_files_entry.targetDir }}').

# Absent is legal and means false, so the check is on the value only when
# the operator supplied one - `default(false)` collapses "absent" onto the
# documented default rather than treating it as a type violation.
#
# fail_msg needs the same default even though it is only ever READ on a
# violation: every option of a task is templated when the task runs, so an
# absent flag would blow up here on the passing path.
- name: Assert each optional bulk form flag is a boolean
  ansible.builtin.assert:
    that:
      - vm_files_entry[item] | default(false) is boolean
    fail_msg: >-
      {{ vm_files_entry_ctx }}.{{ item }} must be a boolean
      (got '{{ vm_files_entry[item] | default('') }}').
  loop: "{{ vm_files_bulk_flag_fields }}"
