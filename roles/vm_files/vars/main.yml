---
# Internal vars for the vm_files role. Not part of the input contract -
# defaults/main.yml owns that. These live in vars/ (not defaults/)
# precisely so a caller cannot override them: the sub-field sets ARE the
# contract, so a consumer widening one locally would fork the schema.
#
# Each sub-field is named exactly once. The allow-lists that drive the
# unknown-sub-field rejection are composed from the same lists the other
# rules read, so extending a form cannot leave one rule behind - adding a
# flag to the bulk form below both admits it and type-checks it. They are
# named at all (rather than inlined at each use) so a rejection message
# can print the permitted set back to the operator from the very source
# it was validated against.

vm_files_single_allowed_fields:
  - source
  - target

vm_files_bulk_required_fields:
  - pattern
  - targetDir

# The optional bulk sub-fields whose only rule is "boolean if present".
# A list, so the type check is one looped task rather than one task per
# flag for the loop to drift away from.
vm_files_bulk_flag_fields:
  - recurse
  - preserveRelativePath

vm_files_bulk_allowed_fields: >-
  {{ vm_files_bulk_required_fields + vm_files_bulk_flag_fields }}

# The glob wildcards the bulk resolver expands, each mapped to what it
# means as a regular expression. Resolution turns a pattern into one
# expression and matches candidate paths against it, so this mapping is
# the whole definition of what a wildcard does: neither crosses a path
# component, which is what stops 'foo*' from reaching into a
# sub-directory.
#
# One mapping rather than a list plus a translation step, because every
# rule below is derived from it - admitting a new wildcard here teaches
# the anchor rule, the tokeniser and the expansion about it at once.
vm_files_wildcard_regexes:
  "*": "[^/]*"
  "?": "[^/]"

vm_files_wildcard_chars: "{{ vm_files_wildcard_regexes.keys() | join }}"

# Cuts a path at the first component containing a wildcard, and at the
# component boundary before it: '/src/foo*/x' loses '/foo*/x' and anchors
# at '/src', never at '/src/foo'. Anchoring mid-component would relativise
# matches against a prefix that is not a directory, which is exactly the
# case PreserveRelativePath has to get right.
vm_files_anchor_cut_re: "(^|/)[^/]*[{{ vm_files_wildcard_chars }}].*$"

# Splits a glob into an alternating run of wildcards and literal text, so
# each token is either a key of the mapping above or a literal to escape.
# Tokenising beats escaping-then-unescaping: the literal runs never have
# to be un-escaped again, so nothing has to know how regex_escape spells
# things.
vm_files_glob_token_re: >-
  [{{ vm_files_wildcard_chars }}]|[^{{ vm_files_wildcard_chars }}]+

# The one wildcard PowerShell's Get-ChildItem expands that this engine
# does not: a character class ('[ab].jar'). Refused outright rather than
# treated as a literal - see _assert-bulk-entry.yml for why silence would
# be the worse failure.
vm_files_unsupported_wildcard: "["

# The transport's ownership policy - what every copied file and every
# directory the role creates ends up as, regardless of what the source
# carried on the controller. The rationale for the values themselves lives
# in the role README (Transport).
#
# The file trio is named because the report quotes it: an operator reading
# 'root:root 0644' off the report is reading the same three values the
# transport applied, so the report cannot claim a policy the role does not
# enforce. The directory trio has one use site and no second reader; it is
# named alongside it so the whole policy is stated in one place rather than
# half here and half inline on a task.
#
# In vars/ for the same reason the schema lists are: the policy is an
# invariant consumers rely on, so a caller must not be able to override it
# for one host and quietly land world-writable files everywhere else.
vm_files_file_owner: root
vm_files_file_group: root
vm_files_file_mode: "0644"

vm_files_dir_owner: root
vm_files_dir_group: root
vm_files_dir_mode: "0755"
