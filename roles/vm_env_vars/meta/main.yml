---
# Role metadata. The galaxy_info block exists to satisfy ansible-lint's
# role-name / meta-no-info rules, not to publish to Galaxy (this repo is
# consumed via a sibling checkout - see the repo README).

galaxy_info:
  role_name: vm_env_vars
  author: Common-Ansible
  description: >-
    Reconcile a sentinel-delimited managed block of system-wide environment
    variables inside /etc/environment on a provisioned VM. Consumes the
    `envVars` object of a VM definition unchanged, and rejects a malformed
    entry before the file is touched.
  license: MIT
  min_ansible_version: "2.18"
  platforms:
    - name: Ubuntu
      versions:
        - noble
  galaxy_tags:
    - system
    - environment

# Standalone: the role carries its whole mechanism and reads the desired
# block from the caller's vars. Nothing else depends on it as a meta dep.
dependencies: []
