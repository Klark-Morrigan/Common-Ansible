---
# Role metadata. The galaxy_info block exists to satisfy ansible-lint's
# role-name / meta-no-info rules, not to publish to Galaxy (this repo is
# consumed via a sibling checkout - see the repo README).

galaxy_info:
  role_name: toolchain_apt
  author: Common-Ansible
  description: >-
    Shared section-2 VM-downloaded toolchain mechanism: install a set of
    pinned apt packages directly on the target, idempotently. The
    section-2 counterpart to toolchain_host_push; ships with a
    shellcheck-pinned use for the ci-bash lint step.
  license: MIT
  min_ansible_version: "2.18"
  platforms:
    - name: Ubuntu
      versions:
        - noble
  galaxy_tags:
    - system
    - toolchain

# Standalone: the role carries its whole mechanism and reads the desired
# package set from the caller's vars. Nothing else depends on it as a meta
# dep; consumers include it with their package list.
dependencies: []
