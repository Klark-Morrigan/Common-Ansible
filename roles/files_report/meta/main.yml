---
# Role metadata. The galaxy_info block exists to satisfy ansible-lint's
# role-name / meta-no-info rules, not to publish to Galaxy (this repo is
# consumed via a sibling checkout - see the repo README).

galaxy_info:
  role_name: files_report
  author: Common-Ansible
  description: >-
    Render which operator-declared files reached this VM - every file a
    glob expanded to, its source, its VM path, its ownership and whether
    this run wrote it. Reads the files_report_entries accumulator; copies
    nothing itself.
  license: MIT
  min_ansible_version: "2.18"
  platforms:
    - name: Ubuntu
      versions:
        - noble
  galaxy_tags:
    - system
    - files

# Standalone: the role reads one accumulator var and renders it. It has no
# meta dep on vm_files - a play that includes it without one reports an
# empty run, which is itself informative.
dependencies: []
